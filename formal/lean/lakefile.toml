name = "n2p3_pilot"
version = "0.1.0"
defaultTargets = ["N2P3Continuous"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

[[lean_lib]]
name = "N2P3Pilot"
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "N2P3"
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "N2P3Program"
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "N2P3Continuous"
moreLeanArgs = ["-j1"]
