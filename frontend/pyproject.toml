[project]
name = "brainsync-gtn-workstation"
version = "0.1.0"
description = "BrainSync acquisition and personal-model workstation"
requires-python = ">=3.10,<3.11"
dependencies = [
  "brainsync-sdk==0.3.0",
  "numpy==1.26.4",
  "PySide6==6.11.2",
  "pyedflib==0.1.42",
  "pyqtgraph==0.14.0",
  "qasync==0.28.0",
  "scipy==1.15.3",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
