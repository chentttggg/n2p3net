[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "n2p3-net"
version = "0.1.0"
description = "Performance-first oddball P300 decoding research framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "torch>=2.4",
]

[project.optional-dependencies]
signals = ["mne>=1.8", "pandas>=2.2", "moabb>=1.1"]
baselines = ["pyriemann>=0.6", "braindecode>=1.7"]
dev = ["pytest>=8.0", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# -p no:cacheprovider 禁用缓存，避免受限环境下写 .pytest_cache 的 PermissionError 噪音
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
# Preserve conventional mathematical tensor names (X, H, W, etc.) used throughout
# the EEG model equations and implementations.
ignore = ["E501", "N803", "N806", "N812"]
