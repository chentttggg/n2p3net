<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>N2P3-Net LOSO 实时训练仪表盘</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f6f5f1; color: #2c2c2a; padding: 20px; }
  h1 { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #5f5e5a; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #d3d1c7; border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 13px; font-weight: 500; color: #444441; margin-bottom: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid #d3d1c7; border-radius: 12px; padding: 12px 14px; }
  .kpi .v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11px; color: #5f5e5a; margin-top: 2px; }
  .kpi.good .v { color: #0f6e56; }
  .bar { height: 10px; background: #e7e5dd; border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: #1d9e75; width: 0%; transition: width .6s; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .chartbox { background: #fff; border: 1px solid #d3d1c7; border-radius: 12px; padding: 12px; height: 260px; }
  .chartbox h2 { font-size: 13px; font-weight: 500; color: #444441; margin-bottom: 6px; }
  .err { color: #993c1d; font-size: 13px; padding: 8px; }
  input#run { font-size: 13px; padding: 6px 8px; border: 1px solid #b4b2a9; border-radius: 8px; width: 240px; }
  button { font-size: 13px; padding: 6px 12px; border: 1px solid #b4b2a9; border-radius: 8px;
           background: #fff; cursor: pointer; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .live { font-size: 11px; color: #0f6e56; }
  .live.off { color: #993c1d; }
</style>
</head>
<body>
<h1>N2P3-Net LOSO 实时训练仪表盘</h1>
<div class="sub">轮询 progress.jsonl（每 3 秒）· 含逐 fold 训练/验证 LOSS · 训练结束后自动展示最终结果 · 无参数时自动跟踪 active_run.txt（启动器维护）</div>
<div class="controls">
  <label style="font-size:12px;color:#5f5e5a">run 名称：</label>
  <input id="run" placeholder="glm_v3_full242">
  <button onclick="location.search='?run='+encodeURIComponent(document.getElementById('run').value)">加载</button>
  <span class="live off" id="livetag">● 未连接</span>
</div>
<div class="kpis" id="kpis"></div>
<div class="bar"><div id="barfill"></div></div>
<div class="charts">
  <div class="chartbox"><h2>运行均值：hit / fold AUC（逐 fold 更新）</h2><canvas id="c1"></canvas></div>
  <div class="chartbox"><h2>逐 fold 指标</h2><canvas id="c2"></canvas></div>
  <div class="chartbox"><h2>最近 fold 训练/验证 LOSS 曲线（早停轨迹）</h2><canvas id="c3"></canvas></div>
  <div class="chartbox"><h2>每 fold 训练耗时（秒）</h2><canvas id="c4"></canvas></div>
  <div class="chartbox"><h2>逐 fold 最终训练 LOSS</h2><canvas id="c5"></canvas></div>
</div>
<p class="err" id="err"></p>
<script>
const params = new URLSearchParams(location.search);
let RUN = params.get("run") || null;
async function resolveRun() {
  if (RUN) return RUN;
  try {
    const r = await fetch("active_run.txt", { cache: "no-store" });
    if (r.ok) {
      const name = (await r.text()).trim();
      if (name) { RUN = name; return RUN; }
    }
  } catch {}
  const CANDIDATES = ["glm_v3_full242", "glm_v2_full242", "_progress_smoke"];
  RUN = CANDIDATES[0];
  return RUN;
}
const charts = {};
function mkChart(id, cfg) {
  if (charts[id]) { charts[id].destroy(); }
  charts[id] = new Chart(document.getElementById(id), cfg);
}
function kpi(v, l, good) {
  return `<div class="kpi${good ? " good" : ""}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
}
let prevFoldCount = -1;
async function tick() {
  await resolveRun();
  document.getElementById("run").value = RUN;
  const errEl = document.getElementById("err");
  try {
    const r = await fetch(`runs/${RUN}/progress.jsonl`, { cache: "no-store" });
    if (!r.ok) throw new Error(`progress.jsonl 不存在（HTTP ${r.status}）——旧版 run 无实时进度，或 run 名错误`);
    const text = await r.text();
    const lines = text.trim().split("\n").filter(Boolean).map(s => { try { return JSON.parse(s); } catch { return null; } }).filter(Boolean);
    const manifest = lines.find(l => l.type === "manifest") || {};
    const folds = lines.filter(l => l.type === "fold");
    const done = lines.some(l => l.type === "done");
    document.getElementById("livetag").textContent = done ? "● 已完成" : "● 实时";
    document.getElementById("livetag").className = "live" + (done ? "" : "");
    const total = manifest.total_folds || folds.length || "?";
    const pct = manifest.total_folds ? (folds.length / manifest.total_folds * 100) : 0;
    document.getElementById("barfill").style.width = pct + "%";

    // KPI
    const hits = folds.filter(f => f.hit !== null).map(f => f.hit);
    const aucs = folds.map(f => f.fold_auc).filter(v => isFinite(v));
    const fit = folds.map(f => f.fit_sec).filter(v => v);
    const mean = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length) : NaN;
    let eta = "—";
    if (fit.length >= 5 && manifest.total_folds) {
      const rate = fit.slice(-20).reduce((x, y) => x + y, 0) / Math.min(20, fit.length);
      eta = fmtTime(rate * (manifest.total_folds - folds.length));
    }
    // 最终结果（record.json 存在则读）
    let final = null;
    try {
      const rr = await fetch(`runs/${RUN}/record.json`, { cache: "no-store" });
      if (rr.ok) final = await rr.json();
    } catch {}
    const hitRate = hits.length ? mean(hits) : NaN;
    const aucNow = mean(aucs);
    document.getElementById("kpis").innerHTML =
      kpi(`${folds.length}/${total}`, "folds 完成") +
      kpi(isFinite(hitRate) ? hitRate.toFixed(4) : "—", "运行 hit（digit 级）", true) +
      kpi(isFinite(aucNow) ? aucNow.toFixed(4) : "—", "运行 fold-AUC 均值", true) +
      kpi(eta, "预计剩余") +
      (final ? kpi((final.results.hit_rate_mean ?? 0).toFixed(4), "最终 hit") +
              kpi((final.results.auc_mean ?? 0).toFixed(4), "最终 AUC") : "");

    if (folds.length !== prevFoldCount) {
      prevFoldCount = folds.length;
      // 图1：运行均值
      const runHit = [], runAuc = [], idx = [];
      let hs = 0, hn = 0;
      const aucWin = [];
      folds.forEach((f, i) => {
        idx.push(i + 1);
        if (f.hit !== null) { hs += f.hit; hn++; }
        runHit.push(hn ? hs / hn : null);
        aucWin.push(f.fold_auc);
        runAuc.push(mean(aucWin));
      });
      mkChart("c1", {
        type: "line",
        data: { labels: idx, datasets: [
          { label: "运行 hit", data: runHit, borderColor: "#1d9e75", pointRadius: 0, borderWidth: 2, tension: .2 },
          { label: "运行 fold-AUC", data: runAuc, borderColor: "#378add", pointRadius: 0, borderWidth: 2, tension: .2 },
        ]},
        options: { animation: false, responsive: true, maintainAspectRatio: false,
          scales: { y: { suggestedMin: 0.4, suggestedMax: 1.0 } } }
      });
      // 图2：逐 fold
      mkChart("c2", {
        type: "bar",
        data: { labels: folds.map(f => f.fold + 1), datasets: [
          { label: "fold AUC", data: folds.map(f => f.fold_auc), backgroundColor: "#85b7eb" },
          { label: "fold hit", data: folds.map(f => f.hit), backgroundColor: "#5dcaa5" },
        ]},
        options: { animation: false, responsive: true, maintainAspectRatio: false,
          scales: { y: { suggestedMin: 0, suggestedMax: 1 } } }
      });
      // 图4：fit 时长
      mkChart("c4", {
        type: "line",
        data: { labels: folds.map(f => f.fold + 1), datasets: [
          { label: "fit 秒", data: fit, borderColor: "#ba7517", pointRadius: 1, borderWidth: 1.5 },
        ]},
        options: { animation: false, responsive: true, maintainAspectRatio: false }
      });
    }
    // 图3：最近 fold 训练/验证 loss（每次都更新，轻量）
    const last = folds[folds.length - 1];
    const vl = last && last.val_losses ? last.val_losses : [];
    const tl = last && last.train_losses ? last.train_losses : [];
    const nEp = Math.max(vl.length, tl.length);
    mkChart("c3", {
      type: "line",
      data: { labels: Array.from({length: nEp}, (_, i) => i + 1), datasets: [
        { label: `fold ${last ? last.fold + 1 : "-"} train loss`, data: tl, borderColor: "#ba7517", pointRadius: 2, borderWidth: 2 },
        { label: `fold ${last ? last.fold + 1 : "-"} val loss`, data: vl, borderColor: "#993556", pointRadius: 2, borderWidth: 2, borderDash: [5, 3] },
      ]},
      options: { animation: false, responsive: true, maintainAspectRatio: false }
    });
    // 图5：逐 fold 最终训练 loss
    mkChart("c5", {
      type: "line",
      data: { labels: folds.map(f => f.fold + 1), datasets: [
        { label: "末 epoch train loss", data: folds.map(f => f.train_losses && f.train_losses.length ? f.train_losses[f.train_losses.length - 1] : null), borderColor: "#7F77DD", pointRadius: 1.5, borderWidth: 1.5 },
      ]},
      options: { animation: false, responsive: true, maintainAspectRatio: false }
    });
    errEl.textContent = "";
  } catch (e) {
    document.getElementById("livetag").textContent = "● 未连接";
    document.getElementById("livetag").className = "live off";
    errEl.textContent = e.message;
  }
}
function fmtTime(s) {
  if (!isFinite(s) || s < 0) return "—";
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
